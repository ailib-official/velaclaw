# Default config — embedded at build time for fallback when no config file exists.
# This is separate from ai-protocol manifest defaults (DEFAULT_PROTOCOL_MODEL_ID).
# Edit this file to change velaclaw runtime defaults without touching Rust code.

default_provider = "deepseek/deepseek-chat"
default_model = "deepseek/deepseek-chat"
default_temperature = 0.7

[autonomy]
level = "supervised"
workspace_only = true
forbidden_paths = ["/etc", "/root", "/var/run"]
max_actions_per_hour = 100
max_cost_per_day_cents = 10000
