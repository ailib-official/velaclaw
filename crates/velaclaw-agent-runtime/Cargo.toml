[package]
name = "velaclaw-agent-runtime"
version = "0.1.0"
edition = "2021"
authors = ["Luqiang Wang"]
license = "MIT OR Apache-2.0"
description = "VelaClaw agent runtime — dispatcher, BYOK, loop parse/prompt/scrub helpers (VL-ARCH-007/008/010)"
repository = "https://github.com/ailib-official/velaclaw"
rust-version = "1.87"

[features]
default = []
ai-protocol = ["dep:ai-lib-rust"]

[dependencies]
velaclaw-config = { path = "../velaclaw-config", version = "0.1.0", features = ["ai-protocol"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
anyhow = "1.0"
regex = "1"
tracing = { version = "0.1", default-features = false }
async-trait = "0.1"
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
# VL-TTC-016 / ALR-TTC-016: ToolFormatError ladder @ ddee3ce (rollback: 2200cb1)
ai-lib-rust = { version = "1.3.0", git = "https://github.com/ailib-official/ai-lib-rust", rev = "cc49a15db70f63c1d4c51a388472ecf9d72f2824", optional = true }
