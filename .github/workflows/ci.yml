# ZeroSpider — minimal CI (migration plan Phase 0: ai-protocol graph must compile).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ZS-ML-013: Merge gate must not implicitly require `legacy-providers`.
  rust-protocol-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.lock is honored
        run: |
          cargo fetch --locked
          git diff --exit-code Cargo.lock

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo check (ai-protocol feature)
        run: cargo check --workspace --features ai-protocol --locked

      - name: cargo check (ai-protocol + routing_mvp — compile gate)
        run: cargo check -p zerospider --features "ai-protocol routing_mvp" --lib --locked

      - name: cargo test (ai-protocol feature)
        run: cargo test --workspace --features ai-protocol --locked

      - name: cargo check (protocol-only, no default features)
        run: cargo check -p zerospider --no-default-features --features ai-protocol --lib --locked

      - name: cargo test (protocol-only, no default features)
        run: cargo test -p zerospider --no-default-features --features ai-protocol --locked

  rust-legacy-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.lock is honored
        run: |
          cargo fetch --locked
          git diff --exit-code Cargo.lock

      - name: cargo test (ai-protocol + legacy — factory + provider_resolution)
        run: cargo test -p zerospider --features "ai-protocol legacy-providers" --locked
