[package]
name = "velaclaw-agent-runtime"
version = "0.1.0"
edition = "2021"
authors = ["Luqiang Wang"]
license = "MIT OR Apache-2.0"
description = "VelaClaw agent runtime — tool dispatcher, BYOK execution (VL-ARCH-007)"
repository = "https://github.com/ailib-official/velaclaw"
rust-version = "1.87"

[features]
default = []
ai-protocol = ["dep:ai-lib-rust", "dep:tracing"]

[dependencies]
velaclaw-config = { path = "../velaclaw-config", version = "0.1.0", features = ["ai-protocol"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
anyhow = "1.0"
async-trait = "0.1"
tokio = { version = "1.50", default-features = false, features = ["rt-multi-thread", "macros", "time"] }
ai-lib-rust = { version = "1.0.1", git = "https://github.com/ailib-official/ai-lib-rust", rev = "fcd5a7b", optional = true }
tracing = { version = "0.1", optional = true }
