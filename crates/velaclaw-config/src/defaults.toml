# Default config — embedded at build time for first-install config.toml generation.
# Keep default_provider/default_model in sync with DEFAULT_PROTOCOL_MODEL_ID in defaults.rs.
# Autonomy/security defaults use AutonomyConfig::default() in Rust (stricter path denylist).

default_provider = "nvidia/nemotron-4-340b-instruct"
default_model = "nvidia/nemotron-4-340b-instruct"
default_temperature = 0.7

# CLI terminal render (VL-CLI-RENDER-003). Optional; omit for same defaults.
[cli_render]
fold_lines = 10
markdown_enabled = true
