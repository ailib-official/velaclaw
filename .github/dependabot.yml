version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: daily
    target-branch: main
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    groups:
      rust-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # VL-NA-000 / VL-MA-006: stay on wasmi 0.31.x (fuel API). Majors need a
      # dedicated runtime-wasm adapter task, not Dependabot lockfile bumps.
      - dependency-name: "wasmi"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    target-branch: main
    open-pull-requests-limit: 1
    labels:
      - "ci"
      - "dependencies"
    groups:
      actions-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
    target-branch: main
    open-pull-requests-limit: 1
    labels:
      - "ci"
      - "dependencies"
    groups:
      docker-all:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
