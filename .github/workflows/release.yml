# VelaClaw — release workflow (tag-driven)
# 打 tag v* 时自动：构建 + cargo publish crates.io + GitHub Release
name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io + GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui-chat/package-lock.json

      - name: Build Web Chat UI
        working-directory: ui-chat
        run: |
          npm ci
          npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check (default features — ai-protocol)
        run: cargo check --workspace --locked

      - name: cargo test (default features)
        run: cargo test --workspace --locked

      - name: cargo publish crates.io
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p velaclaw-config --locked
          cargo publish -p velaclaw-agent-runtime --locked
          cargo publish -p velaclaw --locked

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
