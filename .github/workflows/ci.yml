# VelaClaw — minimal CI (migration plan Phase 0: ai-protocol graph must compile).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ZS-ML-015: protocol-only CI after removing the legacy HTTP provider factory.
  rust-protocol-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify Cargo.lock is honored
        run: |
          cargo fetch --locked
          git diff --exit-code Cargo.lock

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (default features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: cargo check (ai-protocol feature)
        run: cargo check --workspace --features ai-protocol --locked

      - name: cargo check (ai-protocol + routing_mvp — compile gate)
        run: cargo check -p velaclaw --features "ai-protocol routing_mvp" --lib --locked

      - name: cargo test (ai-protocol feature)
        run: cargo test --workspace --features ai-protocol --locked

      - name: cargo check (protocol-only, no default features)
        run: cargo check -p velaclaw --no-default-features --features ai-protocol --lib --locked

      - name: cargo test (protocol-only, no default features)
        run: cargo test -p velaclaw --no-default-features --features ai-protocol --locked

  # Feature-matrix guard: non-default feature surfaces must compile and pass
  # clippy `-D warnings`. Without this, optional features rot silently between
  # releases (historical regressions: D1 hardware missing trait import, D2
  # channel-lark prost-derive disabled, D3 channel-matrix recursion-limit
  # overflow — all repaired in the preceding fix(features) PR). Runs only
  # after the protocol-required job is green so transient base failures do
  # not amplify across the matrix.
  #
  # Coverage is intentionally additive: only features that are *currently*
  # clippy-clean are gated here. The following feature flags compile but
  # still emit clippy warnings in their feature-gated code and will be added
  # to this matrix as separate, scoped cleanup PRs land:
  #
  #   * sandbox-landlock  (1 lint: clippy::assertions_on_constants in tests)
  #   * whatsapp-web      (7 lints incl. wildcard import, large_futures)
  #   * peripheral-rpi    (3 lints: redundant_closure + cast_possible_truncation)
  #   * rag-pdf           (1 lint: collapsible_if)
  #   * probe             (11 lints incl. format_collect, wildcard_in_or_patterns)
  #
  # Once those are cleaned up, append them to the `feature:` list below.
  rust-feature-matrix:
    needs: rust-protocol-required
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - browser-native
          - channel-lark
          - channel-matrix
          - hardware
          - memory-postgres
          - observability-otel
          - remote-deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: feature-${{ matrix.feature }}

      - name: cargo clippy (--features ${{ matrix.feature }})
        run: cargo clippy -p velaclaw --features "${{ matrix.feature }}" --all-targets --locked -- -D warnings
